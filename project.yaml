    apple_silicon:
      excellent: 10-15 tok/s
      good: 5-10 tok/s
      acceptable: 2-5 tok/s
    intel:
      good: 5-10 tok/s
      acceptable: 3-5 tok/s
      slow: 1-3 tok/s

