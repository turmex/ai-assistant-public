# AI Assistant Project Specification
# Auto-generated from codebase analysis on 2024-10-13

project:
  name: ai-assistant-public
  version: 0.1.0
  repository: https://github.com/turmex/ai-assistant-public
  type: local-first-ai-assistant
  description: Privacy-focused AI assistant with hardware-aware LLM selection

languages:
  - python
  - javascript
  - html
  - css

stack:
  backend:
    framework: FastAPI
    version: 0.109.0
    server: Uvicorn
    server_version: 0.27.0
    orm: SQLAlchemy
    orm_version: 2.0.25
    database: SQLite
    database_file: ai_assistant.db
    python_version: "3.8+"
    python_recommended: "3.10+"
    validation: Pydantic
    validation_version: 2.5.3
    http_client: httpx
    http_client_version: 0.26.0

  frontend:
    framework: vanilla-js
    html_version: HTML5
    styling: Tailwind-CSS
    styling_version: "3.x"
    styling_source: CDN
    file: frontend/index.html
    lines_of_code: 543

  llm:
    engine: Ollama
    host: localhost
    port: 11434
    base_url: http://localhost:11434
    models:
      - name: llama3.2:1b
        size_gb: 1.3
        quality: basic
        recommended_ram: 4
      - name: llama3.2:3b
        size_gb: 2.0
        quality: medium
        recommended_ram: 4
      - name: phi3:mini
        size_gb: 2.3
        quality: medium
        recommended_ram: 5
      - name: mistral:7b
        size_gb: 4.1
        quality: high
        recommended_ram: 9
      - name: llama3.1:8b
        size_gb: 4.7
        quality: high
        recommended_ram: 10
        recommended: true
      - name: gemma2:9b
        size_gb: 5.5
        quality: high
        recommended_ram: 11
      - name: llama3.2:11b
        size_gb: 6.5
        quality: high
        recommended_ram: 13
      - name: codellama:13b
        size_gb: 7.4
        quality: high
        recommended_ram: 15

components:
  - name: main
    file: backend/main.py
    type: api-server
    lines_of_code: 650
    dependencies:
      - database
      - hardware_detector
      - conversation_manager
      - httpx
      - FastAPI
    endpoints:
      - method: GET
        path: /
        description: Service information
        response: JSON
      - method: GET
        path: /health
        description: Health check (Ollama, DB, hardware)
        response: HealthResponse
      - method: GET
        path: /hardware
        description: Hardware specs and compatible models
        response: JSON
      - method: GET
        path: /models
        description: List downloaded models
        response: ModelsResponse
      - method: GET
        path: /models/available
        description: List hardware-compatible models
        response: JSON
      - method: GET
        path: /models/downloaded
        description: List locally available models
        response: JSON
      - method: POST
        path: /models/download
        description: Download model via Ollama
        request: ModelDownloadRequest
        response: JSON
      - method: POST
        path: /chat
        description: Send message, get AI response
        request: ChatRequest
        response: ChatResponse
        timeout: 120s
      - method: GET
        path: /conversations
        description: List user conversations
        query_params:
          - name: limit
            type: int
            default: 20
        response: JSON
      - method: POST
        path: /conversations/new
        description: Create new conversation
        response: JSON
      - method: GET
        path: /conversations/{id}
        description: Get conversation history
        path_params:
          - name: id
            type: str
            description: Conversation UUID
        response: JSON
      - method: DELETE
        path: /conversations/{id}
        description: Delete conversation
        path_params:
          - name: id
            type: str
            description: Conversation UUID
        response: JSON
    features:
      - Multi-fallback chat strategy (3 tiers)
      - Context sanitization for Ollama
      - Hardware-aware model selection
      - Lifespan management (startup/shutdown)
      - CORS middleware (permissive for MVP)
      - Automatic OpenAPI/Swagger docs

  - name: database
    file: backend/database.py
    type: data-layer
    lines_of_code: 322
    database:
      engine: SQLite
      file: ai_assistant.db
      connection_string: sqlite:///./ai_assistant.db
    models:
      - name: User
        table: users
        fields:
          - name: id
            type: Integer
            primary_key: true
          - name: email
            type: String
            unique: true
            indexed: true
          - name: created_at
            type: DateTime
            default: utcnow
        relationships:
          - tool_connections
          - workflows
          - conversations
        status: future-ready (MVP uses default user)

      - name: ToolConnection
        table: tool_connections
        fields:
          - name: id
            type: Integer
            primary_key: true
          - name: user_id
            type: Integer
            foreign_key: users.id
          - name: service_name
            type: String
            values: [gmail, calendar, salesforce]
          - name: display_name
            type: String
          - name: is_connected
            type: Boolean
          - name: auth_data
            type: Text
            description: Encrypted OAuth tokens
          - name: last_connected
            type: DateTime
          - name: created_at
            type: DateTime
          - name: updated_at
            type: DateTime
        indexes:
          - [user_id, service_name]
        status: schema-ready (Phase 2)

      - name: Workflow
        table: workflows
        fields:
          - name: id
            type: Integer
            primary_key: true
          - name: user_id
            type: Integer
            foreign_key: users.id
          - name: name
            type: String
          - name: description
            type: Text
          - name: trigger
            type: JSON
            schema: "{type: schedule/manual/event, config: {...}}"
          - name: actions
            type: JSON
            schema: "[{tool: gmail, action: send, params: {...}}]"
          - name: is_active
            type: Boolean
          - name: use_local_llm
            type: Boolean
          - name: created_at
            type: DateTime
          - name: updated_at
            type: DateTime
          - name: last_run
            type: DateTime
        relationships:
          - executions
        indexes:
          - [user_id, is_active]
        status: schema-ready (Phase 3)

      - name: WorkflowExecution
        table: workflow_executions
        fields:
          - name: id
            type: Integer
            primary_key: true
          - name: workflow_id
            type: Integer
            foreign_key: workflows.id
          - name: status
            type: String
            values: [pending, running, success, failed]
          - name: started_at
            type: DateTime
          - name: completed_at
            type: DateTime
          - name: actions_executed
            type: JSON
          - name: results
            type: JSON
          - name: error_message
            type: Text
          - name: model_used
            type: String
          - name: tokens_used
            type: Integer
        indexes:
          - [workflow_id, status]
          - [started_at]
        status: schema-ready (Phase 3)

      - name: Conversation
        table: conversations
        fields:
          - name: id
            type: Integer
            primary_key: true
          - name: user_id
            type: Integer
            foreign_key: users.id
          - name: conversation_id
            type: String
            unique: true
            indexed: true
            description: UUID
          - name: messages
            type: JSON
            schema: "[{role: user/assistant, content: str, timestamp: ISO8601, metadata: {...}}]"
          - name: created_at
            type: DateTime
          - name: updated_at
            type: DateTime
        indexes:
          - [user_id]
          - [updated_at]
        status: active (MVP)
    functions:
      - name: init_db
        description: Create all tables
      - name: get_db
        description: FastAPI dependency for session management
        returns: Generator[Session]
      - name: get_or_create_user
        description: Get/create default user for MVP
        default_email: default@local

  - name: hardware_detector
    file: backend/hardware_detector.py
    type: utility
    lines_of_code: 415
    purpose: Mac hardware detection and model recommendations
    pattern: Singleton
    detection:
      chip_type:
        method: platform.machine()
        values: [arm64, x86_64]
        maps_to: [Apple Silicon, Intel]
      chip_model:
        method: sysctl -n machdep.cpu.brand_string
        examples: [M1, M2, M2 Pro, M2 Max, M3, M3 Ultra, Intel Core i7]
      ram_gb:
        method: sysctl -n hw.memsize
        unit: bytes
        converts_to: GB
      cpu_cores:
        method: sysctl -n hw.physicalcpu
        returns: int
    algorithm:
      steps:
        - Filter models by RAM (need 2x model size)
        - Calculate performance score (RAM headroom + chip type)
        - Sort by performance → quality → size
        - Mark best-fit as recommended
      performance_tiers:
        - excellent: Apple Silicon, 8GB+ headroom, ≤5GB model
        - good: Apple Silicon, 4GB+ headroom, ≤7GB model
        - acceptable: Any chip, 0GB+ headroom
        - slow: Insufficient RAM headroom
    model_catalog:
      source: hardcoded
      count: 8
      location: MODEL_CATALOG constant
      update_strategy: manual (ADR-005)
    classes:
      - name: HardwareInfo
        type: dataclass
        fields:
          - chip_type
          - chip_model
          - ram_gb
          - cpu_cores
          - compatible_models
          - recommended_model
          - detection_successful
          - error_message
      - name: ModelInfo
        type: dataclass
        fields:
          - name
          - display_name
          - size_gb
          - expected_performance
          - speed_estimate
          - quality
          - recommended
          - ram_required_gb
      - name: HardwareDetector
        methods:
          - detect() -> HardwareInfo
          - _detect_chip_type() -> str
          - _detect_chip_model() -> Optional[str]
          - _detect_ram_gb() -> int
          - _detect_cpu_cores() -> int
          - _get_compatible_models() -> List[ModelInfo]
          - _calculate_performance() -> tuple[str, str]
    functions:
      - name: get_hardware_detector
        description: Get singleton instance
        returns: HardwareDetector

  - name: conversation_manager
    file: backend/conversation_manager.py
    type: business-logic
    lines_of_code: 390
    purpose: Chat state management and conversation persistence
    pattern: Repository
    class: ConversationManager
    methods:
      - name: create_conversation
        params:
          - user_id: Optional[int]
        returns: Conversation
        generates: UUID for conversation_id

      - name: get_conversation
        params:
          - conversation_id: str
        returns: Optional[Conversation]

      - name: add_message
        params:
          - conversation_id: str
          - role: str (user/assistant)
          - content: str
          - metadata: Optional[Dict]
        updates: conversation.messages JSON
        uses: flag_modified() for SQLAlchemy

      - name: get_conversation_history
        params:
          - conversation_id: str
          - limit: Optional[int]
        returns: List[Dict]

      - name: get_context_for_llm
        params:
          - conversation_id: str
          - max_messages: int (default 10)
        returns: List[Dict[str, str]]
        format: "[{role: str, content: str}]"
        strips: metadata and timestamps

      - name: detect_intent
        params:
          - user_message: str
          - conversation_id: Optional[str]
        returns: Dict[intent_type, tools_needed, confidence]
        implementation: keyword-based (MVP)
        future: LLM-based classification (Phase 2)

      - name: get_user_conversations
        params:
          - user_id: Optional[int]
          - limit: int (default 20)
        returns: List[Conversation]
        order: updated_at DESC

      - name: delete_conversation
        params:
          - conversation_id: str
        returns: bool
    functions:
      - name: get_conversation_manager
        params:
          - db: Session
        returns: ConversationManager
        pattern: Factory

  - name: frontend
    file: frontend/index.html
    type: single-page-application
    lines_of_code: 543
    technologies:
      - HTML5
      - Tailwind CSS (CDN)
      - Vanilla JavaScript (ES6+)
    features:
      ui_components:
        - Header with status badge
        - Hardware info dashboard
        - Model selector dropdown
        - Chat container with message bubbles
        - Message input textarea
        - Send button
        - Example prompts sidebar
        - Toast notifications
        - Download progress indicator
      state_management:
        - conversationId: null | string
        - availableModels: Array
        - downloadedModels: Array
        - selectedModel: null | ModelInfo
      api_client:
        base_url: http://localhost:8000
        default_timeout: 20000ms
        chat_timeout: 120000ms
        functions:
          - fetchJSON(url, opts, timeout)
          - updateHealthStatus()
          - loadHardware()
          - loadModels()
          - sendMessage(text)
          - downloadModel(modelName)
      ui_functions:
        - messageBubble({role, text, model})
        - typingBubble()
        - toast(msg, type)
        - scrollToBottom(force)
        - updateModelInfo(model)
      styling:
        theme: dark
        primary_color: indigo
        background: slate-950 to slate-800 gradient
        animations:
          - typing (dots)
          - pingSoft (status badge)
          - spin (loading)

data_flow:
  chat_message:
    - step: 1
      component: frontend
      action: User types message and clicks Send

    - step: 2
      component: frontend
      action: POST /chat with {message, conversation_id?, model?}
      timeout: 120s

    - step: 3
      component: main.py
      action: Receive request, validate with Pydantic

    - step: 4
      component: conversation_manager
      action: get_conversation(id) or create_conversation()

    - step: 5
      component: conversation_manager
      action: add_message(role="user", content=message)

    - step: 6
      component: database
      action: UPDATE conversations SET messages=... WHERE id=...

    - step: 7
      component: conversation_manager
      action: get_context_for_llm(conversation_id, max=10)

    - step: 8
      component: main.py
      action: sanitize_context(messages) - validate role/content structure

    - step: 9
      component: main.py
      action: Multi-fallback strategy
      attempts:
        - POST /api/chat with full context (10 messages)
        - POST /api/chat with last user message only
        - POST /api/generate with flattened prompt

    - step: 10
      component: ollama
      action: Generate response with selected model

    - step: 11
      component: main.py
      action: parse_ollama_reply(data) - extract text from various formats

    - step: 12
      component: conversation_manager
      action: add_message(role="assistant", content=reply, metadata={model, tokens})

    - step: 13
      component: database
      action: UPDATE conversations SET messages=..., updated_at=now()

    - step: 14
      component: main.py
      action: Return ChatResponse(response, conversation_id, model_used, tokens)

    - step: 15
      component: frontend
      action: Render assistant message bubble with model tag

  hardware_detection:
    - step: 1
      component: main.py
      action: Startup - lifespan event

    - step: 2
      component: hardware_detector
      action: get_hardware_detector() - singleton initialization

    - step: 3
      component: hardware_detector
      action: platform.machine() → arm64 or x86_64

    - step: 4
      component: hardware_detector
      action: sysctl commands for chip model, RAM, cores

    - step: 5
      component: hardware_detector
      action: _get_compatible_models() - filter MODEL_CATALOG by RAM

    - step: 6
      component: hardware_detector
      action: _calculate_performance() for each model

    - step: 7
      component: hardware_detector
      action: Sort models by performance → quality → size

    - step: 8
      component: hardware_detector
      action: Mark best-fit as recommended=True

    - step: 9
      component: hardware_detector
      action: Return HardwareInfo with compatible_models and recommended_model

    - step: 10
      component: main.py
      action: Cache globally (singleton pattern)

  model_download:
    - step: 1
      component: frontend
      action: User clicks Download button for non-downloaded model

    - step: 2
      component: frontend
      action: POST /models/download with {model_name}

    - step: 3
      component: main.py
      action: POST /api/pull to Ollama

    - step: 4
      component: ollama
      action: Download model from Ollama library (background)

    - step: 5
      component: main.py
      action: Return {status: "download_started"}

    - step: 6
      component: frontend
      action: Show "Downloading..." spinner

    - step: 7
      component: frontend
      action: Poll GET /models/downloaded every 5 seconds

    - step: 8
      component: frontend
      action: Detect model in list → show success toast → refresh UI

