architecture_patterns:
  - pattern: Singleton
    component: hardware_detector
    location: hardware_detector.py:409-414
    rationale: Hardware is immutable during runtime

  - pattern: Factory
    component: conversation_manager
    location: conversation_manager.py:379-389
    rationale: Decouple from database session lifecycle

  - pattern: Repository
    component: ConversationManager
    location: conversation_manager.py:23-377
    rationale: Abstract database operations

  - pattern: Dependency Injection
    component: FastAPI routes
    mechanism: Depends(get_db)
    rationale: Automatic session management

  - pattern: Multi-Fallback
    component: chat endpoint
    location: main.py:486-512
    strategies:
      - /api/chat with full context
      - /api/chat with last message
      - /api/generate with flattened prompt
    rationale: Reliability over single point of failure

future_roadmap:
  phase_1:
    name: Infrastructure Foundation
    weeks: 1-2
    features:
      - Documentation (completed)
      - Testing framework (pytest)
      - Structured logging
      - Monitoring (Prometheus + Grafana)
      - Code quality tools (black, ruff, mypy)

  phase_2:
    name: MCP Tool Integration
    weeks: 3-5
    features:
      - OAuth framework (Google, Salesforce)
      - MCP client setup
      - Gmail integration
      - Calendar integration
      - Salesforce integration
      - LLM-based intent detection

  phase_3:
    name: Workflow Automation
    weeks: 6-8
    features:
      - Workflow engine
      - Workflow builder UI
      - Pre-built templates
      - Conditional logic
      - Approval steps

  phase_4:
    name: Cloud LLM Routing
    weeks: 9-10
    features:
      - Anthropic (Claude) integration
      - OpenAI (GPT) integration
      - Smart routing (simple→local, complex→cloud)
      - Cost tracking
      - API key management

  phase_5:
    name: Multi-Agent Collaboration
    weeks: 11-14
    features:
      - Multi-user authentication
      - Organization model
      - Agent system
      - Agent-to-agent communication
      - Shared knowledge base
      - Consensus building

constraints:
  - Single-user in MVP (multi-user in Phase 5)
  - Mac-only in MVP (Apple Silicon or Intel)
  - Requires macOS 11.0+ (Big Sur)
  - Requires 8GB+ RAM (16GB+ recommended)
  - No authentication in MVP
  - No streaming responses in MVP
  - SQLite in MVP (PostgreSQL in Phase 5)
  - Hardcoded model catalog (dynamic in Phase 1)

system_requirements:
  hardware:
    platform: macOS
    version_min: 11.0
    cpu: Apple Silicon (M1/M2/M3) or Intel
    ram_min: 8GB
    ram_recommended: 16GB
    disk_space: 10GB (for models)

  software:
    python: "3.8+"
    python_recommended: "3.10+"
    ollama: latest
    browser: Modern browser with ES6+ support

performance:
